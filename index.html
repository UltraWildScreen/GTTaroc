<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eef3f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GTTaroc">
<title>GTTaroc</title>
<style>
:root{--bg:#f0f0f0;--card:#fff;--ink:#14231f;--accent:#2d4c98;--btn:#fbdf00;--btn-ink:#2a1500;--grey:#d2d8eb;--band:#c62828;--bandink:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a18;--card:#1b2926;--ink:#e8f1ee;--accent:#6fd6c3;--grey:#2c3d39}}
*{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.demo-banner{background:#c62828;color:#fff;text-align:center;font-weight:900;font-size:12px;letter-spacing:.45px;padding:9px 8px;border-radius:7px;margin:0 0 12px}
h1{font-size:30px;margin:12px 20px 16px}
.top{display:flex;align-items:center;gap:12px;color:var(--accent);font-size:18px;font-weight:600;margin-bottom:6px}
.x{background:var(--grey);border:0;border-radius:0 28px 28px 0;width:70px;height:48px;font-size:25px;font-weight:100;color:var(--accent);margin-left:-16px;cursor:pointer;align-items:center;justify-content:center;line-height:1;padding:0}
.top span{flex:1;text-align:center;margin-right:54px}
.card{background:var(--card);border-radius:10px;padding:6px 16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px}
.card .l{color:var(--accent);text-transform:uppercase;font-size:12px;font-weight:600;flex:0 0 auto}
.card .v{text-align:right;font-size:12px;font-weight:600;word-break:break-word}
label{display:block;color:var(--accent);margin:14px 0 6px;font-size:15px}
input{width:100%;font-size:18px;padding:14px;border-radius:12px;border:2px solid var(--grey);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:10px 20px;font-size:18px;font-weight:750;margin-top:12px;cursor:pointer}
.main{background:var(--btn);color:var(--btn-ink)}
.sec{background:var(--grey);color:var(--accent)}
.gra{background:#d0d0d0;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;max-width:90%;display:none;z-index:30}
.hide{display:none}
/* Schermata biglietto: intestazione e pulsanti fissi, elenco scorrevole */
#s2:not(.hide){position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100vh;height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;background:var(--bg);z-index:10}
#s2 .top,#s2 h1,#s2 .demo-banner{flex-shrink:0}
#cards{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px;scrollbar-width:none;-ms-overflow-style:none}
#cards::-webkit-scrollbar{display:none}
#s2 .btn{flex-shrink:0;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<section id="s1">
  <h1>Nuovo biglietto</h1>
  <label for="now">NOW (data e ora)</label>
  <input id="now" type="datetime-local">
  <label for="linea">Linea</label>
  <input id="linea" type="text" value="Linea 72" autocomplete="off">
  <button class="btn main" id="go">GENERA</button>
</section>

<section id="s2" class="hide">
  <div class="top"><button class="x" id="back" aria-label="Chiudi">X</button><span>BIGLIETTO SCELTO</span></div>
  <h1>DAILY</h1>
  <div id="cards"></div>
  <button class="btn main" data-sim>CONVALIDA</button>
  <button class="btn gra" data-sim>AUTOCONVALIDA</button>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
(function(){
  var pad=function(n){return String(n).padStart(2,"0")};
  var fmt=function(d){return pad(d.getDate())+"-"+pad(d.getMonth()+1)+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
  var local=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};
  var nowEl=document.getElementById("now"), lineaEl=document.getElementById("linea");
  nowEl.value=local(new Date());
  var addMin=function(d,m){return new Date(d.getTime()+m*60000)};
  var esc=function(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

  document.getElementById("go").onclick=function(){
    var now=nowEl.value?new Date(nowEl.value):new Date();
    var linea=lineaEl.value.trim()||"—";
    var val=addMin(now,-12), buy=addMin(now,-15);
    var fine=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,3,0);
    var scad=new Date(buy.getFullYear()+1,buy.getMonth(),buy.getDate(),buy.getHours(),buy.getMinutes());
    var rows=[
      ["Descrizione tariffaria","Daily APP"],
      ["Tipo","Valido fino al termine del servizio<br>del giorno della prima<br>validazione, rete URBANA<br>+ SUBURBANA GTT"],
      ["Durata","Viaggi in METRO illimitati"],
      ["Inizio validazione",fmt(val)],
      ["Ultima validazione",fmt(val)],
      ["Linea",esc(linea)],
      ["Fine validazione",fmt(fine)],
      ["Viaggi residui","0"],
      ["Data acquisto",fmt(buy)],
      ["Scadenza",fmt(scad)],
      ["Prezzo","3,70€"],
      ["Seriale biglietto","38026942013376089"],
      ["Seriale contratto","AE110BE0-00C666E9"]
    ];
    document.getElementById("cards").innerHTML=rows.map(function(r){return '<div class="card"><div class="l">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>'}).join("");
    document.getElementById("s1").classList.add("hide");
    document.getElementById("s2").classList.remove("hide");
    window.scrollTo(0,0);
  };
  document.getElementById("back").onclick=function(){
    document.getElementById("s2").classList.add("hide");
    document.getElementById("s1").classList.remove("hide");
  };
  var t=document.getElementById("toast"),tm;
  document.querySelectorAll("[data-sim]").forEach(function(b){
    b.onclick=function(){t.textContent="Site not reachable";t.style.display="block";clearTimeout(tm);tm=setTimeout(function(){t.style.display="none"},2000)};
  });
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>	
</body>
</html>
